summary:
  schemas_total: 176
  entities_documented: 12
  identifier_style: >-
    Opaque UUIDs on every entity (`id`). Most content entities additionally carry a human-readable
    `slug`, and public read paths accept either form via the `{uuid-or-slug}` path parameter.
    Content entities also carry a separate `content_id`, the CMS-side identifier (the backend is
    Wagtail-based, exposed through the `wagtail_meta` object).
  polymorphism: >-
    Recipes, articles and videos are all "feed items" and share a `type` discriminator plus a
    common `user_reactions` block. The `/feed/` and `/feed-item/{uuid-or-pk}/` endpoints return
    the mixed stream, and likes/ratings are attached to a feed item rather than to a recipe or
    article directly (see `/users/me/likes/feed-items/` and `/users/me/rating/{feeditem-uuid}/`).
