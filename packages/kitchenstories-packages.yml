notes: >-
  Kitchen Stories publishes no client library for its own API. The Kitchen Stories Internal API
  is a first-party backend consumed by the company's own apps and website, and there is no
  developer program or SDK for third parties. The packages below are genuine first-party
  open-source releases from the KitchenStories GitHub organization, but none of them is a client
  for the Kitchen Stories API — they are general-purpose UI and appliance-integration libraries.
  Because no API client library exists, this repo deliberately does NOT carry an `SDKs` pointer.
  Searched and found nothing on: PyPI (`kitchenstories` 404), Maven Central, NuGet, pkg.go.dev,
  RubyGems, Packagist, crates.io.
