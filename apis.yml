aid: kitchenstories
name: Kitchen Stories
description: Kitchen Stories is a Berlin-based, video-first cooking and recipe platform founded in 2013
  by Verena Hubertz and Mengting Boensch, and majority-owned by the BSH Group (Bosch Siemens Hausgeraete)
  since 2017. The company publishes roughly 15,000 recipes and articles with HD step-by-step video
  tutorials across its iOS and Android apps, website, smart TVs, and Amazon Echo Show, reaching more than
  6 million unique users from over 22 million app downloads. Alongside the consumer product it runs
  Kitchen Stories Business, a branded-content and native-advertising arm working with around 300 brand
  partners, and an online shop for its own organic spice mixes. Its content platform is served by the
  Kitchen Stories Internal API (Ultron), a bearer-token REST API at api.kitchenstories.io covering
  recipes, articles, videos, ingredients, utensils, categories, user cookbooks, meal plans, comments,
  ratings, and personalization.
