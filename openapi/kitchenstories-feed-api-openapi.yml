          type: string
        name:
          type: string
        metric:
          type: string
        imperial:
          type: string
      required:
      - id
      additionalProperties: false
    unit:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        featured_order:
          type: number
        ingredient_pluralizable:
          type: boolean
        name:
          type: object
          properties:
            one:
              type: string
            many:
              type: string
            rendered:
              type: string
          required:
          - rendered
          additionalProperties: false
      required:
      - id
      - name
      - ingredient_pluralizable
      - type
    feed_collection:
      type: object
      properties:
        type:
          type: string
        collection:
          type: object
          properties:
            title:
              type: string
            content:
              type: array
              items:
                oneOf:
                - $ref: '#/components/schemas/collection_article'
                - $ref: '#/components/schemas/collection_recipe'
                - $ref: '#/components/schemas/collection_category'
                - $ref: '#/components/schemas/collection_shopping_tip'
            hide_for_web:
              type: boolean
            hide_for_app:
              type: boolean
          required:
          - title
          - content
          additionalProperties: false
      required:
      - type
      - collection
    image:
      type: object
      properties:
        id:
          oneOf:
          - type: string
          - type: number
        url:
          type: string
          format: uri
        source:
          type: string
        source_link:
          type: string
        width:
          type: number
        height:
          type: number
      required:
      - url
      additionalProperties: false
    search_category:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        content_id:
          type: string
        image:
          $ref: '#/components/schemas/image'
        icon:
          $ref: '#/components/schemas/image'
        description:
          type: string
        search:
          type: object
          properties:
            query:
              type: string
            filters:
              type: string
            index:
              type: string
        url:
          type: string
          format: uri
        publishing:
          $ref: '#/components/schemas/publishing'
        meta:
          $ref: '#/components/schemas/wagtail_meta'
      required:
      - content_id
      - publishing
      - title
      - url
      - slug
      - meta
      - description
      - id
      - image
      - icon
    feed_recipe_reduced:
      type: object
      properties:
        type:
          type: string
        recipe:
          $ref: '#/components/schemas/recipe_reduced'
        hide_for_web:
          type: boolean
        hide_for_app:
          type: boolean
      required:
      - type
      - recipe
    feed_article_reduced:
      type: object
      properties:
        type:
          type: string
        article:
          $ref: '#/components/schemas/article_reduced'
        hide_for_web:
          type: boolean
        hide_for_app:
          type: boolean
      required:
      - type
      - article
    feed_player:
      type: object
      properties:
        type:
          type: string
        player:
          type: object
          properties:
            title:
              type: string
            video_title:
              type: string
            video:
              $ref: '#/components/schemas/video'
            recipe:
              $ref: '#/components/schemas/recipe'
            hide_for_web:
              type: boolean
            hide_for_app:
              type: boolean
          required:
          - video_title
          - video
          - title
          additionalProperties: false
      required:
      - player
      - type
    article_cta_button:
      type: object
      properties:
        type:
          type: string
        cta_button:
          type: object
          properties:
            text:
              type: string
            link:
              type: string
          required:
          - text
          - link
      required:
      - cta_button
      - type
    collection_shopping_tip_reduced:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        subtitle:
          type: string
        shopping_tip:
          $ref: '#/components/schemas/article_reduced'
        hide_for_web:
          type: boolean
        hide_for_app:
