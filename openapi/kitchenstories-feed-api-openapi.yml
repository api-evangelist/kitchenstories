          additionalProperties: false
      required:
      - type
      - collection
    user_public_reduced:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
        new_type:
          type: string
        image:
          $ref: '#/components/schemas/image'
          nullable: true
