    collection_article:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        subtitle:
          type: string
        article:
          oneOf:
          - $ref: '#/components/schemas/article_simplified'
          - $ref: '#/components/schemas/article'
        hide_for_web:
          type: boolean
        hide_for_app:
          type: boolean
      required:
