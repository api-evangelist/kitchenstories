          type: string
        author:
          $ref: '#/components/schemas/user_public'
        created:
          type: string
          format: date-time
        original_comment:
          type: string
        original_language_code:
          type: string
        original_location:
          type: string
        comment:
          type: string
        like_count:
          type: number
        reply_count:
          type: number
        feed_item:
          oneOf:
          - $ref: '#/components/schemas/feed_article'
          - $ref: '#/components/schemas/feed_recipe'
        recent_answers:
          type: array
          items:
            $ref: '#/components/schemas/comment_comment'
        images:
          type: array
          items:
            $ref: '#/components/schemas/comment_image'
          maxItems: 10
        errors:
          type: object
          additionalProperties: false
          nullable: true
      required:
      - author
      - created
      - like_count
      - id
      - original_location
      - original_comment
      - reply_count
    comment_image:
      type: object
      properties:
        comment:
          type: string
        author:
          $ref: '#/components/schemas/user_public'
        original_location:
          type: string
        image:
          $ref: '#/components/schemas/image'
        created:
          type: string
          format: date-time
      required:
      - author
      - created
      - image
      - original_location
      - comment
    article_proscons:
      type: object
      properties:
        type:
          type: string
        proscons:
