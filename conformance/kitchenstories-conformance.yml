summary: >-
  A conventional REST/JSON API with a self-published OpenAPI 3.0.0 description and HTTP bearer
  authentication. It conforms to no cross-cutting industry profile: there is no OAuth 2.0
  authorization server, no OIDC, no RFC 9457 problem details, no idempotency contract and no
  published compliance certification. Kitchen Stories publishes no trust centre and names no
  audited certification (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP) on any of its public
  properties, so no `Compliance` pointer is emitted.
standards:
- id: openapi
